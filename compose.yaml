# Local Postgres for development and the database tests (docs/spec/v0.1.md
# section 17.2). The same image as the CI service container. The project name
# is fixed so every worktree shares one container: test runs each create their
# own throwaway database inside it.
#
#   docker compose up -d --wait
#
name: finders-eaters

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finders_eaters
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d finders_eaters']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
