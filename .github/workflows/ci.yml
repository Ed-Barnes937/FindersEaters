# PR checks (docs/spec/operations.md sections 3 and 4, docs/spec/v0.1.md section
# 17.2): format, the migration checks, lint, typecheck, unit and database tests,
# the production build, the Playwright smoke test against that build on a
# 390 px viewport, and the deploy image with its release step. Postgres is a
# container on the runner; nothing here touches cloud resources. Retries are 0 everywhere:
# a flaky test is a bug, so nothing here re-runs on failure.
name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint, typecheck, test, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finders_eaters
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finders_eaters"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CI: true
      # The service container above: throwaway and local to the runner.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/finders_eaters
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json packageManager

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      # docs/spec/operations.md section 4; packages/db/migrations/README.md.
      - name: Migrations apply from empty
        run: pnpm --filter @finders-eaters/db migrate

      - name: drizzle-kit check
        run: pnpm --filter @finders-eaters/db migrations:check

      - name: Migrations match the schema
        run: |
          pnpm --filter @finders-eaters/db migrations:generate
          changes="$(git status --porcelain -- packages/db/migrations)"
          if [ -n "$changes" ]; then
            echo "::error::The schema has changes with no migration. Run 'pnpm --filter @finders-eaters/db migrations:generate' and commit the result."
            echo "$changes"
            exit 1
          fi

      - name: Destructive-statement lint
        run: pnpm --filter @finders-eaters/db migrations:lint

      - name: Lint, typecheck, unit and database tests, build
        run: pnpm exec turbo run lint typecheck test build

      - name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @finders-eaters/web exec playwright install --with-deps chromium

      - name: Playwright smoke (production build, 390 px)
        run: pnpm exec turbo run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The deploy image, built and exercised on the runner's own Docker: the
  # release step against a fresh Postgres container (from empty, then again),
  # a release that must fail, and the server's /health
  # (docs/spec/operations.md section 3.1), then the backup scripts against
  # it. Nothing is pushed anywhere.
  image:
    name: image, release step and backup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Fly configs agree with the spec and each other
        run: python3 scripts/check-fly-configs.py

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: finders-eaters:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release step and /health against a fresh container
        run: scripts/image-smoke.sh finders-eaters:ci

      # The nightly backup and the staging refresh, end to end against local
      # stand-ins: Postgres containers for production and staging, RustFS for
      # the Tigris bucket (docs/spec/operations.md sections 5.2 and 6).
      - name: Backup, restore-verify and staging refresh against a local S3 store
        run: scripts/backup/e2e.sh finders-eaters:ci
